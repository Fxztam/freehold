name: Freehold CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Freehold tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install --upgrade pip lark DHParser

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go-frontend/go.mod'

      - name: CLI smoke test
        run: python -m freehold --version

      - name: Full regression suite
        run: python -m freehold test --no-console --json-summary ci_summary.json

      - name: Language modules (V1 core subset from both folders)
        shell: pwsh
        run: |
          $modules1 = Get-ChildItem -Path .\tests\language_modules -Directory |
            Where-Object { $_.Name -notmatch 'generics|concurrency|grpc' } |
            Sort-Object Name

          $failures = @()
          foreach ($module in $modules1) {
            Write-Output "=== MODULE (01) $($module.Name) ==="
            python -m freehold test-language --module $module.Name --root .\tests\language_modules
            if ($LASTEXITCODE -ne 0) {
              $failures += "language_modules:$($module.Name)"
            }
          }

          $modules2 = Get-ChildItem -Path .\tests\language_modules_02 -Directory |
            Where-Object { $_.Name -notmatch 'generics|rpc|async|feature_integration' } |
            Sort-Object Name

          foreach ($module in $modules2) {
            Write-Output "=== MODULE (02) $($module.Name) ==="
            python -m freehold test-language --module $module.Name --root .\tests\language_modules_02
            if ($LASTEXITCODE -ne 0) {
              $failures += "language_modules_02:$($module.Name)"
            }
          }

          $modules3 = Get-ChildItem -Path .\tests\language_modules_v2_3 -Directory |
            Sort-Object Name

          foreach ($module in $modules3) {
            Write-Output "=== MODULE (v2_3) $($module.Name) ==="
            python -m freehold test-language --module $module.Name --root .\tests\language_modules_v2_3
            if ($LASTEXITCODE -ne 0) {
              $failures += "language_modules_v2_3:$($module.Name)"
            }
          }

          if ($failures.Count -gt 0) {
            Write-Output "FAILED_MODULES:"
            $failures | ForEach-Object { Write-Output $_ }
            exit 1
          }

          $total_count = $modules1.Count + $modules2.Count + $modules3.Count
          Write-Output "ALL_LANGUAGE_MODULES_PASSED $total_count"

      - name: Verify and run examples
        shell: pwsh
        run: |
          $examples = Get-ChildItem -Path .\examples -Filter *.fh | Sort-Object Name
          $failures = @()

          foreach ($example in $examples) {
            Write-Output "=== VERIFY $($example.Name) ==="
            python -m freehold verify $example.FullName
            if ($LASTEXITCODE -ne 0) {
              $failures += "verify:$($example.Name)"
              continue
            }

            Write-Output "=== RUN $($example.Name) ==="
            python -m freehold run $example.FullName
            if ($LASTEXITCODE -ne 0) {
              $failures += "run:$($example.Name)"
            }
          }

          if ($failures.Count -gt 0) {
            Write-Output "FAILED_EXAMPLES:"
            $failures | ForEach-Object { Write-Output $_ }
            exit 1
          }

          Write-Output "ALL_EXAMPLES_VERIFY_AND_RUN_PASSED $($examples.Count)"

      - name: Step runner smoke
        run: python tools/test_steps.py --no-regression

      - name: Run parser conformance verification (Compiler v1 frontend parity & baseline protect)
        run: .\verify-parser-conformance.cmd

      - name: Run compiler examples verification (Go package gen & runtime log checks)
        run: .\verify-compiler-examples.cmd

      - name: Run stage 3 compiler core contracts verification (Self-hosting compiler core verifications)
        run: .\verify-stage3-compiler-core-v1.cmd

      - name: Run stage 3 compiler examples verification (Self-hosting compiler on examples)
        run: .\verify-stage3-compiler-examples.cmd